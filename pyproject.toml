[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "popari"
dynamic = ["version"]

authors = [
  { name="Shahul Alam", email="alam.shahul@gmail.com" },
]
dependencies = [
    "numpy",
    "scipy",
    "scanorama",
    "scikit-learn",
    "pandas",
    "anndata",
    "torch",
    "tqdm",
    "loguru",
    "umap-learn",
    "scanpy",
    "seaborn",
    "matplotlib",
    "squidpy",
    "gseapy",
    "kneed",
    "louvain",
    "leidenalg",
    "pymetis",
    "awkward",
    "ortools",
    "upsetplot>=0.9",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
]
description = "Popari: a probabilistic graphical model for integrated spatial transcriptomics analysis"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.hatch.metadata]
allow-direct-references = true # This allows us to specify dependencies on GitHub; maybe can remove later

[tool.hatch.version]
path = "popari/__about__.py"

[project.urls]
"Homepage" = "https://github.com/alam-shahul/popari"
"Bug Tracker" = "https://github.com/alam-shahul/popari/issues"

[project.optional-dependencies]
simulation = [
  "jupyterlab",
  "jupyterlab_execute_time",
]
jupyter = [
  "jupyterlab",
  "jupyterlab_execute_time",
  "jupyter-resource-usage",
]
wandb = [
  "wandb>=0.17.9,<0.18",
]
benchmark = [
  "multiprocess>=0.70.15",
  "scmultisim",
  "sctm",
]
migration = [
  "mlflow>=2.5.0",
  "tenacity",
  "wandb>=0.17.9,<0.18",
]

[tool]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
scmultisim = { path = "../scmultisim", editable = true }
sctm = { path = "../scTM", editable = true }
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.hatch.build.targets.sdist]
include = [
  "popari/**/*.py",
]

[tool.hatch.build.targets.wheel]
include = [
  "popari/**/*.py",
]

[tool.flake8]
max-line-length = 120
count = true
extend-ignore = [
    "E203",  # conflicting with black style slicing
    "D107",  # only need docstring at class level, no need at __init__
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cheap: lightweight smoke tests for quick validation during refactors",
    "baseline: fast, default regression checks for core functionality",
    "expensive: slower integration checks involving repeated training, analysis, hierarchy, or simulation",
    "gpu: tests that run Popari training on CUDA",
]

# Dev requirements
[dependency-groups]
dev = [
    "ipdb",
    "ipython",
    "nox",
    "pre-commit",
    "pytest",
    "python-dotenv"
]
test = [
    "ipdb",
    "ipython",
    "nox",
    "pre-commit",
    "pytest",
    "python-dotenv",
    "jupyterlab",
    "jupyterlab_execute_time",
]
