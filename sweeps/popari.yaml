program: scripts/train.py
entity: popari
project: revisions
method: grid

metric:
  name: nll_spatial
  goal: minimize

parameters:
  "data.dataset_path":
    value: /path/to/input.h5ad
  "model.K":
    values: [8, 10, 12, 15, 20]
  "model.lambda_Sigma_x_inv":
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-2
  "model.spatial_affinity_lr":
    distribution: log_uniform_values
    min: 1.0e-3
    max: 5.0e-2
  "model.embedding_step_size_multiplier":
    values: [0.5, 1.0, 2.0]
  "model.random_state":
    value: 0
  "model.initialization_method":
    value: leiden_fast
  dtype:
    value: float64

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
  - tracking.enabled=true
